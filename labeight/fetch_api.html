<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch API Studio</title>
    <script>
      function fetchData() {
        fetch("https://jsonplaceholder.typicode.com/comments/1")
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("output").innerHTML = `<h3>${data.name}</h3><p>${data.body}</p>`;
          })
          .catch((error) => {
            document.getElementById("output").innerHTML = "Error fetching data";
          });
      }
    </script>
  </head>
  <body>
    <div class="container" style="font-family: Arial, sans-serif; max-width: 700px; margin: 60px auto; padding: 28px; border-radius: 20px; background: linear-gradient(135deg, #ecfccb, #e0f2fe); box-shadow: 0 18px 40px rgba(20,83,45,.12);">
      <h1>Fetch API Example</h1>
      <button onclick="fetchData()" style="background: linear-gradient(135deg, #16a34a, #34d399); color: white; border: none; border-radius: 999px; padding: 12px 18px; font-weight: bold;">Fetch Comment</button>
      <div id="output" style="margin-top: 20px"></div>
    </div>
  </body>
</html>
