<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Memory</title>
    <script>
      function saveToSessionStorage() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        sessionStorage.setItem("name", name);
        sessionStorage.setItem("email", email);
        alert("Data saved to session storage");
      }
      function retrieveFromSessionStorage() {
        const name = sessionStorage.getItem("name");
        const email = sessionStorage.getItem("email");
        if (name && email) {
          document.getElementById("output").innerHTML = `<p>Name: ${name}</p><p>Email: ${email}</p>`;
        } else {
          document.getElementById("output").innerHTML = "No data found in session storage";
        }
      }
      function clearSessionStorage() {
        sessionStorage.clear();
        alert("Session storage cleared");
        document.getElementById("output").innerHTML = "";
      }
    </script>
  </head>
  <body style="font-family: Arial, sans-serif; background: linear-gradient(135deg, #fef3c7, #fef2f2); min-height: 100vh; padding: 40px;">
    <div style="max-width: 620px; margin: 0 auto; background: rgba(255,255,255,0.88); border-radius: 20px; padding: 30px; box-shadow: 0 18px 40px rgba(15,23,42,.08);">
      <h1>Session Storage Example</h1>
      <form onsubmit="event.preventDefault(); saveToSessionStorage();">
        <label for="name">Name:</label>
        <input type="text" id="name" required />
        <br /><br />
        <label for="email">Email:</label>
        <input type="email" id="email" required />
        <br /><br />
        <button type="submit">Save to Session Storage</button>
      </form>
      <br />
      <button onclick="retrieveFromSessionStorage()">Retrieve Data</button>
      <button onclick="clearSessionStorage()">Clear Storage</button>
      <div id="output" style="margin-top: 20px"></div>
    </div>
  </body>
</html>
