<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Portal</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #3b0764, #4f46e5, #22d3ee);
        color: white;
      }
      form {
        background: rgba(17, 24, 39, 0.7);
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      }
      input, button { padding: 12px; border-radius: 10px; border: none; }
      button { background: linear-gradient(135deg, #f472b6, #f59e0b); color: #111827; font-weight: bold; }
    </style>
  </head>
  <body>
    <h1>Submit Your Details</h1>
    <form action="http://127.0.0.1:3000/" method="POST">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />
      <br /><br />
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />
      <br /><br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
