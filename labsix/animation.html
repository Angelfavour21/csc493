<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Orbit</title>
    <link rel="stylesheet" href="styles3.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        color: #e0f2fe;
        background: radial-gradient(
          ellipse at 50% 110%,
          #164e63,
          #082f49 58%,
          #071525
        );
      }
      .frame {
        width: min(760px, calc(100% - 32px));
        padding: 26px;
        border: 1px solid rgba(125, 211, 252, 0.24);
        border-radius: 24px;
        background: rgba(8, 47, 73, 0.62);
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section id="animation-section">
        <h2>Canvas Orbit</h2>
        <canvas
          id="myCanvas"
          width="640"
          height="360"
          aria-label="Animated circle crossing the canvas"
        ></canvas>
      </section>
    </main>
    <script src="javascript3.js"></script>
  </body>
</html>
